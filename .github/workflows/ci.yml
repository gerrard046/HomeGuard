# Continuous Integration HomeGuard.
# Menjalankan unit test (pytest) otomatis pada setiap push & pull request.
# Roadmap #1: GitHub Actions CI untuk pytest.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pasang pytest
        run: python -m pip install --upgrade pip pytest

      - name: Jalankan unit test
        run: pytest -q
